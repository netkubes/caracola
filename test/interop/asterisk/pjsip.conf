; Minimal PJSIP configuration for the interoperability tests
; (test/interop/asterisk_test.exs). Users 1000 to 1002, password "secret".

[global]
type=global
user_agent=Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[user](!)
type=endpoint
context=default
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=info
timers=yes
100rel=yes
allow_transfer=yes
mwi_subscribe_replaces_unsolicited=yes
refer_blind_progress=no
; P-Asserted-Identity and Privacy (RFC 3325)
trust_id_inbound=yes
trust_id_outbound=yes
send_pai=yes

[userauth](!)
type=auth
auth_type=userpass
password=secret

[useraor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=0

[1000](user)
auth=1000
aors=1000
mailboxes=1000@default
[1000](userauth)
username=1000
[1000](useraor)
mailboxes=1000@default

[1001](user)
auth=1001
aors=1001
[1001](userauth)
username=1001
[1001](useraor)

[1002](user)
auth=1002
aors=1002
[1002](userauth)
username=1002
; Only SHA-256 (RFC 8760)
supported_algorithms_uas=SHA-256
[1002](useraor)

; Calls originated through the manager interface to any URI
[malla](user)
