; Minimal dialplan for the interoperability tests

[general]
static=yes
writeprotect=no

[default]
; Echo test
exten => 600,1,Answer()
 same => n,Echo()

; Answers and waits
exten => 601,1,Answer()
 same => n,Wait(60)

; Registered users
exten => _100X,1,Dial(PJSIP/${EXTEN},10)
 same => n,Hangup()

; Device state of 1001, for dialog and presence subscriptions
exten => 1001,hint,PJSIP/1001

; Calls from the Caracola proxy (Asterisk registered as a trunk)
exten => asterisk,1,Goto(600,1)
